<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; text-align: center; padding: 24px; }
      main { max-width: 420px; }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { color: #475569; line-height: 1.5; }
      button { margin-top: 16px; background: #1e4fd8; color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>The Family Clinic needs an internet connection to show your records safely. Nothing is stored on this device while you are offline. Please reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
