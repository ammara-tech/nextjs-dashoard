name: Post-deploy checks

# Runs when Vercel reports a successful Production deployment, or on demand,
# or every morning. Tests the live site: browser tests, then Lighthouse.
on:
  deployment_status:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  e2e:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test
        env:
          CI: 'true'
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_PATIENT_EMAIL: ${{ secrets.E2E_PATIENT_EMAIL }}
          E2E_PATIENT_PASSWORD: ${{ secrets.E2E_PATIENT_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report

  lighthouse:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json
      - name: Show scores
        if: always()
        run: |
          node -e '
            const m = require("./lighthouse-report/manifest.json").filter((r) => r.isRepresentativeRun);
            const pct = (n) => Math.round(n * 100);
            const rows = ["| Page | Performance | Accessibility | Best practices | SEO |", "|---|---|---|---|---|"];
            for (const r of m) rows.push(`| ${r.url.replace("https://nextjs-dashoard-psi.vercel.app", "") || "/"} | ${pct(r.summary.performance)} | ${pct(r.summary.accessibility)} | ${pct(r.summary["best-practices"])} | ${pct(r.summary.seo)} |`);
            console.log(rows.join("\n"));
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, rows.join("\n") + "\n");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report
